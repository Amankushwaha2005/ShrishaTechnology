<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="Shrisha Technology - websites, apps, SEO & GEO, logo design and student projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  {% if page and page.key == 'home' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Shrisha Technology",
    "url": "https://shrishatechnology.com/"
  }
  </script>
  {% endif %}
</head>
<body{% if page and page.key %} data-page="{{ page.key }}"{% endif %}{% if promoTicker %} class="has-promo-ticker"{% endif %}>
  {% include "partials/campaign-chrome.html" %}
  {% include "partials/navbar.html" %}
  {% block content %}{% endblock %}
  {% include "partials/footer.html" %}
  {% include "partials/scripts.html" %}
</body>
</html>
