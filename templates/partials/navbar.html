  <header class="site-header">
    <nav class="container navbar">
      <a href="/" class="logo" aria-label="ShrishaTechnology">
        <img src="/images/logo.png" alt="" class="logo-img" width="48" height="48">
        <span class="logo-text">ShrishaTechnology</span>
      </a>
      <ul class="nav-links">
        {% for item in navItems %}
          <li>
            <a href="{{ item.href }}" {% if page.key == item.key %}aria-current="page"{% endif %}>{{ item.label }}</a>
          </li>
        {% endfor %}
      </ul>
      <div class="nav-actions">
        <div class="account-menu">
          <button
            class="account-menu__btn"
            type="button"
            aria-label="Account"
            aria-haspopup="true"
            aria-expanded="false"
            title="Account"
          >
            {% if authUser %}
              {% if accountPicture %}
              <img class="account-menu__photo" src="{{ accountPicture }}" alt="" width="42" height="42" referrerpolicy="no-referrer">
              {% else %}
              <span class="account-menu__initial" aria-hidden="true">{{ accountInitial }}</span>
              {% endif %}
            {% else %}
            <svg class="account-menu__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 12a4.2 4.2 0 1 0-4.2-4.2A4.2 4.2 0 0 0 12 12Zm0 2.2c-3.4 0-8 1.7-8 5.1V21h16v-1.7c0-3.4-4.6-5.1-8-5.1Z"/>
            </svg>
            {% endif %}
          </button>
          <div class="account-menu__dropdown" hidden>
            {% if authUser %}
            <p class="account-menu__name">Hi, {{ authUser.name }}</p>
            {% if isAdmin %}
            <a href="/admin">Admin</a>
            {% endif %}
            <a href="/auth/logout">Logout</a>
            {% else %}
            <a href="/login">Login</a>
            <a href="/signup">Sign up</a>
            {% endif %}
          </div>
        </div>
      </div>
      <button class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-icon" aria-hidden="true">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 14.5a8.5 8.5 0 0 1-11.6-11A9.5 9.5 0 1 0 21 14.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm0-16a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1ZM3 11h1a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Zm17 0h1a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2ZM5.6 4.2a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4Zm10.7 10.7a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4ZM18.4 4.2a1 1 0 0 1 0 1.4l-.7.7a1 1 0 0 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0ZM7.7 14.9a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0Z"/></svg>
        </span>
      </button>
      <button class="menu-toggle" type="button" aria-label="Toggle navigation">&#8942;</button>
    </nav>
  </header>
