# Triggers Render deploy on every push to main (add RENDER_DEPLOY_HOOK_URL in GitHub repo secrets)
name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping hook (Render autoDeploy may still run)."
            exit 0
          fi
          curl -fsS "$DEPLOY_HOOK"
